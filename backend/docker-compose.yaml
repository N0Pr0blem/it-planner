version: '3.8'

services:
  postgres-user:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: planner_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d planner_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/planner_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Mail
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_THREAD_COUNT: ${SPRING_MAIL_THREAD_COUNT:-5}
      SPRING_MAIL_EMAIL_FROM: ${SPRING_MAIL_EMAIL_FROM}
      SPRING_MAIL_PATH_VERIFICATION_FORM: ${SPRING_MAIL_PATH_VERIFICATION_FORM}
      SPRING_MAIL_PATH_INFORMATION_FORM: ${SPRING_MAIL_PATH_INFORMATION_FORM}
      # JWT
      JWT_PASSWORD_SECRET: ${JWT_PASSWORD_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      # MinIO
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-it-planner}
      # AI
      REQUEST_LIMIT_PER_DAY: ${REQUEST_LIMIT_PER_DAY:-10}
      MIN_AI_REQUEST_LENGTH: ${MIN_AI_REQUEST_LENGTH:-3}
      OPEN_AI_API_URL: ${OPEN_AI_API_URL}
      OPEN_AI_API_MODEL: ${OPEN_AI_API_MODEL:-gpt-3.5-turbo}
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY}
      # Server
      SERVER_PORT: 8080
    depends_on:
      postgres-user:
        condition: service_healthy
      minio:
        condition: service_healthy

  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
      - ./minio/init:/docker-entrypoint-init.d
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 40s

volumes:
  postgres_user_data:
  minio_data: