services:
  # ========================================
  # 1. База данных PostgreSQL
  # ========================================
  - type: pserv
    name: postgres-user
    runtime: image
    image:
      url: postgres:15
    envVars:
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        value: planner_db
    disk:
      name: postgres-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10

  # ========================================
  # 2. Java-бэкенд (Spring Boot)
  # ========================================
  - type: web
    name: backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      # База данных — URL берётся из postgres-user
      - key: SPRING_DATASOURCE_URL
        fromService:
          type: pserv
          name: postgres-user
          property: connectionString
      # Данные для входа в БД (заполните вручную такие же, как в postgres-user)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Почта
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_THREAD_COUNT
        sync: false
      - key: SPRING_MAIL_EMAIL_FROM
        sync: false
      - key: SPRING_MAIL_PATH_VERIFICATION_FORM
        sync: false
      - key: SPRING_MAIL_PATH_INFORMATION_FORM
        sync: false
      # JWT
      - key: JWT_PASSWORD_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        sync: false
      # MinIO — адрес берётся из сервиса minio
      - key: MINIO_ENDPOINT
        fromService:
          type: web
          name: minio
          property: hostport
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET_NAME
        value: it-planner
      # AI
      - key: REQUEST_LIMIT_PER_DAY
        sync: false
      - key: MIN_AI_REQUEST_LENGTH
        sync: false
      - key: OPEN_AI_API_URL
        sync: false
      - key: OPEN_AI_API_MODEL
        sync: false
      - key: OPEN_AI_API_KEY
        sync: false
      # Сервер
      - key: SERVER_PORT
        value: "8080"

  # ========================================
  # 3. MinIO (Web Service для первичной настройки)
  # ========================================
  - type: web
    name: minio
    runtime: image
    image:
      url: minio/minio
    envVars:
      - key: MINIO_ROOT_USER
        sync: false
      - key: MINIO_ROOT_PASSWORD
        sync: false
    dockerCommand: server /data --console-address ":10000"
    disk:
      name: minio-data
      mountPath: /data
      sizeGB: 10